name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go and web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web/dist is not committed: make builds it before vet and test, since
      # pf embeds it. go test ./web also runs the web tests.
      - run: make test

  mcp:
    name: MCP smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Windows runners have no make, so build the web app with npm directly.
      - name: Build the web app
        run: npm ci && npm run build
        working-directory: web
      - name: Build pf
        run: go build -o pf${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/pf
      - name: Start pf serve
        run: |
          ./pf serve --addr 127.0.0.1:8080 --data "$RUNNER_TEMP/pf-data" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/serve.log"; exit 1
      - name: Smoke-test pf mcp over stdio
        run: .github/scripts/mcp-smoke.sh ./pf${{ runner.os == 'Windows' && '.exe' || '' }} http://127.0.0.1:8080
